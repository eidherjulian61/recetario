"Hierva abundante agua, realice cortes superficiales en forma de cruz en el lado contrario a donde sale el tallo del tomate. Una vez hierva el agua, sumerja los tomates y déjelos 1 minuto, luego retire del agua y corte la cocción con agua fría. Pele los tomates.", "Corte los tomates en cuartos, retire las semillas y corte luego la pulpa en cubos.", "Retire la piel del melón y la parte blanca, para dejar solo la parte naranjada. Corte en cubos del tamaño de un bocado.", "Corte el zucchini de en cubos.", "Deshoje la albahaca, envuelva varias hojas y corte en tiras (chiffonade).", "Trocee la lechuga con la mano, en trozos del tamaño de un bocado.", "Mezcle la lechuga, albahaca, tomate, zucchini y melón. Reserve.", "Aparte realice la vinagreta rallando la piel del limón, teniendo cuidado de no llegar a la parte blanca. Luego exprima el limón y mezcle con la salsa soya, el aceite de oliva, pimienta y la ralladura.", "Sirva la ensalada y mezcle con la vinagreta."]}, {"title": "Pollo en salsa de finas hierbas", "ingredients": ["1 de pechuga de pollo deshuesada", "500 ml de leche", "40 gr de harina de trigo", "50 gr de mantequilla", "1 gr de orégano seco", "1 gr de tomillo seco", "1 gr de estragón seco", "1 gr de nuez moscada", "50 g de albahaca fresca", "80 gr de crema de leche baja en grasa", "Sal y pimienta", "50 ml de aceite de oliva"], "procedure": ["Filetee el pollo en las porciones deseadas.", "Lave y desinfecte la albahaca. Deshoje, forme un rollo con las hojas y corte en tiras (chiffonade). Reserve.", "En una sartén, derrita la mantequilla y adicione la harina de trigo y la ralladura de nuez moscada. Cocine durante 1 minuto aproximado para formar un roux.", "Incorpore de a poco la leche al roux, mezclando constantemente para evitar que se formen grumos. Cocine sin dejar de remover de 5 a 10 minutos.", "Una vez tome consistencia, adicione la crema de leche, las hierbas secas, sal y pimienta. Apague el fuego y reserve.", "Salpimiente el pollo.", "Caliente una plancha o sartén con un poco de aceite y ase los filetes de pechuga.", "Cuando estén cocidos los filetes, retire del fuego; bañe con la salsa y decore con la albahaca. Papas rústicas al horno"]}, {"title": "Papas rústicas al horno", "ingredients": ["500 gr de papa capira", "50 gr de aceite de girasol", "5 gr de paprika", "4 dientes de ajo", "50 gr de perejil crespo", "Sal y pimienta"], "procedure": ["Lave y desinfecte las papas y perejil.", "Corte las papas en cascos.", "Corte el ajo finamente.", "Retire el tallo del perejil y corte finamente las hojas", "Mezcle el aceite, la paprika, perejil, sal, pimienta y ajo finamente picado.", "Precaliente el horno a 190°c.", "Ponga las papas en una bandeja para horno y bañe con la mezcla de aceite.", "Lleve las papas al horno por 20 minutos o hasta que las papas estén bien cocidas. Puede hacer la prueba “pinchando” las papas con un cuchillo; si entra con facilidad quiere decir que ya están. Ensalada de tomates y maíz tierno"]}, {"title": "Ensalada de tomates y maíz tierno", "ingredients": ["250 gr de tomate cherry", "2 mazorcas tiernas", "20 ml de aceite de girasol", "1 limón Tahití", "15 gr de panela en polvo", "Sal y pimienta", "100 gr de lechuga romana"], "procedure": ["Lave y desinfecte los vegetales.", "Cocine las mazorcas en una olla con agua.", "Desgrane la mazorca y reserve.", "Corte los tomates por la mitad y mezcle con el maíz.", "Trocee la lechuga con la mano en trozos del tamaño de un bocado.", "Prepare la vinagreta mezclando el aceite, el zumo de limón, panela, sal y pimienta.", "Mezcle los vegetales, sirva y bañe con la vinagreta. Limonada cerezada"]}, {"title": "Limonada cerezada", "ingredients": ["500 gr de limón Tahití", "240 gr de cerezas en almíbar", "1.5 litros de agua", "Hielo"], "procedure": ["Lave y desinfecte los limones.", "Exprima los limones.", "Lleve las cerezas a la licuadora con la mitad del almíbar y procese bien.", "Agregue el zumo de limón, agua y hielo.", "Licue nuevamente y verifique la acidez.", "Si es necesario incorpore el almíbar restante."]}, {"title": "Musaka de berenjena", "ingredients": ["500 gr de carne molida de res sabaleta", "500 gr de tomate chonto maduro", "100 gr de pasta de tomate", "4 berenjenas de tamaño mediano y sin arrugas", "100 ml de vino tinto", "1 cebolla blanca", "1 zanahoria", "3 dientes de ajo", "250 gr de queso mozzarella", "30 gr de albahaca fresca", "2 gr de orégano seco", "40 gr de queso parmesano", "50 ml de aceite de oliva", "Sal y pimienta", "5 recipientes de aluminio mediano para lasaña"], "procedure": ["Lave y desinfecte los ingredientes.", "Corte la berenjena en láminas delgadas, póngalas sobre una bandeja y adicióneles sal. Deje reposar.", "Corte la cebolla, la zanahoria, el ajo y el tomate en cubos.", "Caliente una olla con el aceite e incorpore la cebolla y la zanahoria. Deje que se dore un poco y cuando la cebolla esté un poco transparente, adicione el ajo y el tomate.", "Deje rehogar por 3 minutos a fuego medio bajo.", "Adicione el vino para desglasar y deje evaporar.", "Baje del fuego y licue con la pasta de tomate.", "Regrese la preparación a la olla, adicione la carne y el orégano.", "dejar en cocción por 5 minutos y ajustar la sazón. poner las hierbas aromáticas.", "aparte cortar las rebanadas de berenjena, salar en abundancia y dejar reposar por 15 minutos, luego enjuagar y dar una leve cocción salteando con un poco de aceite.", "armar la lasaña intercalando la salsa boloñesa con las rebanadas de berenjena, poner tajada de queso en cada capa.", "terminar con parmesano y llevar a gratinar. Tostaditas de ajo y perejil crespo"]}, {"title": "Tostaditas de ajo y perejil crespo", "ingredients": ["1 pan baguette pequeño", "50 gr de mantequilla", "4 dientes de ajo", "10 gr de perejil crespo", "Sal"], "procedure": ["Lave, desinfecte y corte finamente el perejil.", "Corte el ajo finamente y luego cuando esté bien fino, adiciónele un poco de sal y comience a macerar con el lomo del cuchillo hasta lograr una pasta.", "Caliente una sartén con la mantequilla y sofría un poco el ajo. Por aproximadamente un minuto.", "Corte el pan en rodajas con un cuchillo de sierra para no aplastarlo.", "Unte cada rodaja con la mantequilla y finalice con un poco de perejil.", "Lleve al horno a 180°c hasta que tuesten. Ensalada con mézclum de lechugas"]}, {"title": "Ensalada con mézclum de lechugas", "ingredients": ["½ lechuga crespa verde", "½ lechuga romana", "1 mango tommy grande y firme", "80 gr de maní sin sal", "1 vaso de yogurt de melocotón", "1 limón Tahití", "30 gr de panela en polvo", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "Pele el mango y córtelo en cubos pequeños.", "Caliente una sartén y ponga el mango. Deje que dore un poco y añada la panela.", "Mezcle el mango con la panela para que se le pegue. Retire del fuego y deje enfriar.", "Trocee la lechuga con la mano en trozos de un bocado o envuelva varias hojas y corte en tiras (chiffonade).", "Corte un poco el maní con el cuchillo.", "Mezcle los cubos de mango asados y con el maní troceado.", "Sirva y finalice con un poco de yogurt."]}, {"title": "Ensalada de pastas con tomates al orégano", "ingredients": ["1 lechuga crespa verde", "200 gr de pasta corta o penne", "100 gr de jamón", "250 gr de solomo extranjero", "200 gr de arveja fresca", "1 zanahoria grande", "2 mazorcas dulces", "150 gr de pan tajado", "80 gr de aceite de oliva", "150 gr de aceitunas negras deshuesadas", "100 gr de mayonesa", "50 gr de mostaza", "100 gr de crema de leche", "2 tomates chonto maduro", "1 gr de orégano seco", "1 diente de ajo", "40 gr de queso parmesano", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "Ponga una olla con abundante agua a hervir. Cuando hierva adicione sal y deje que vuelva a romper hervor. Adicione la pasta y deje cocer hasta que este al dente. Retire del agua y enfríe rápidamente con agua fresca.", "Corte la carne en cubos y salpimiente. Caliente una sartén con un poco de aceite y saltee la carne. Reserve.", "Aparte, corte los tomates en rebanadas delgadas. Mezcle los tomates con la mitad del aceite de oliva, el ajo finamente picado y el orégano. Caliente una sartén antiadherente y ase los tomates por ambos lados. Reserve.", "Retire los bordes del pan y corte en cubos. Caliente la misma sartén del tomate sin limpiar y adicione el resto de aceite. Ponga los cubos de pan y deje que se tuesten un poco. Reserve.", "Caliente una olla con agua. Mientras hierve el agua, pele la zanahoria y corte en cubos. Cuando hierva el agua, ponga la zanahoria por tres minutos, retire y enfríe rápidamente. Repita el paso con la arveja y el maíz tierno.", "Cuando haya blanqueado el maíz, desgránelo con ayuda de un cuchillo.", "Corte el jamón en julianas.", "Trocee con las manos la lechuga del tamaño de un bocado o enrolle varias hojas y corte en tiras delgadas (chiffonade).", "Mezcle las pastas con el jamón, los cubos de pan, aceitunas, maíz tierno, zanahoria, arveja y lechuga.", "Mezcle la mayonesa, crema de leche y mostaza.", "Sirva y finalice con el aderezo, la carne, tomates asados y queso parmesano. Jugo de mango, naranja y yerbabuena"]}, {"title": "Jugo de mango, naranja y yerbabuena", "ingredients": ["500 gr de mango criollo o tommy maduro", "6 naranja maduras", "40 gr de yerbabuena fresca", "Hielo"], "procedure": ["Lave y desinfecte lo ingredientes.", "Deshoje la hierbabuena.", "Pele y corte en cubos el mango.", "Exprima las naranjas.", "Lleve el zumo de naranja, el mango y la hierbabuena a la licuadora.", "Procese bien y sirva con el hielo."]}, {"title": "Crema de zanahoria y naranja", "ingredients": ["500 gr de zanahoria", "2 naranjas", "200 gr de papa criolla", "100 gr de cebolla puerro", "1 pechuga mediana", "25 gr de mantequilla", "20 gr de cilantro fresco", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "Cocine la pechuga con sal y pimienta.", "Corte la cebolla en aros y lleve a una sartén con mantequilla. Deje que se sofría bien y reserve.", "Mientras se cocina, pele la zanahoria y la papa y corte en trozos.", "Cuando este cocida la pechuga retire de agua y reserve.", "En el caldo de cocción de la pechuga, adicione la zanahoria y la papa. Deje cocinar hasta que estén blandas y licue.", "Adicione el zumo de la naranja a la preparación.", "Lleve nuevamente a cocción y deje reducir un poco.", "Corte el cilantro finamente.", "Finalice con la crema de leche, el puerro, el cilantro y las croquetas de pollo. Croquetas de pollo desmechado"]}, {"title": "Croquetas de pollo desmechado", "ingredients": ["1 pechuga cocida", "2 huevos", "100 gr de harina de trigo", "150 gr de polvo de bizcocho", "2 gr de paprika", "20 gr de perejil crespo", "500 ml de aceite de girasol", "Sal y pimienta"], "procedure": ["Lave y desinfecte el perejil. Corte finamente y mezcle con el polvo de bizcocho.", "Desmeche la pechuga previamente cocida.", "Corte la pechuga lo más pequeño posible o procese. Adicione la paprika y rectifique sal y pimienta.", "Arme bolitas tipo Nuggets y compacte lo que más pueda.", "Pase por harina de trigo, luego por huevo batido y por último en polvo de bizcocho con perejil picado.", "Caliente el aceite y fría los Nuggets hasta que estén dorados. Ensalada verde con vinagreta de aguacate"]}, {"title": "Ensalada verde con vinagreta de aguacate", "ingredients": ["1 lechuga verde crespa", "1 lechuga batavia mediana", "3 tomates verdes", "100 gr de apio fresco", "200 gr de arveja fresca", "1 aguacate maduro pequeño", "1 pepino cohombro", "2 naranjas", "100 gr de panela en polvo", "20 gr de perejil crespo", "50 ml de aceite de oliva", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "Corte el aguacate a la mitad, deseche la semilla y retire la pulpa. Ponga la pulpa en una licuadora con el zumo de las naranjas, el perejil, la panela, el aceite de oliva y un poco de sal y pimienta.", "Caliente una olla con agua y cuando hierva ponga las arvejas. Cocine por tres minutos, retire del agua y enfríe rápidamente.", "Trocee las lechugas con la mano en trozos del tamaño de un bocado o envuelva varias hojas y corte en tiras delgadas (chiffonade).", "Corte los tomates en cubos o medias lunas.", "Retire las venas del apio y corte en medias lunas.", "Corte el pepino en láminas o cubos.", "Sirva la ensalada de manera que se vea bien estéticamente y finalice con la vinagreta. Batido de mora con cereza"]}, {"title": "Batido de mora con cereza", "ingredients": ["500 gr de mora", "240 gr cerezas en almíbar", "250 gr de kumis", "Hielo"], "procedure": ["Retire las hojas de la mora.", "Ponga las moras en la licuadora con el resto de los ingredientes.", "Licue bien y sirva."]}, {"title": "Arroz paisa con chicharrón acaramelado", "ingredients": ["500 gr de arroz", "1 zanahoria pequeña", "3 dientes de ajo", "3 chorizos de cerdo", "1 mazorca dulce", "3 tallos de cebolla larga", "1 plátano maduro", "100 ml aceite de girasol", "2 tomates maduros", "30 gr de cilantro fresco", "500 gr de tocino carnudo", "100 gr de panela en polvo", "100 ml de salsa de soya", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "Corte el tomate y la cebolla larga en cubos pequeños (brunoise) y el ajo finamente.", "Caliente una sartén con un poco de aceite, y sofría el tomate, la cebolla y el ajo, para formar un hogao. Reserve.", "Ponga a calentar una olla con un poco de aceite. Adicione el arroz para sellarlo, removiendo delicadamente hasta que se ponga de un color blanco perlado. Una vez logrado el color deseado, ponga la medida del agua, sal y pimienta.", "Ponga otra olla con agua a calentar y cocine la mazorca. Luego desgránela.", "Pele la zanahoria y luego córtela en cubos. Cocine en agua por tres minutos y reserve.", "Pele el plátano y córtelo en cubos.", "Corte el chorizo en rodajas.", "Caliente una sartén con aceite y sofría el plátano y el chorizo. Reserve.", "Corte el tocino en cubos y sellar en una sartén por todos los lados.", "Mezcle la salsa soya, la panela y una pizca de sal.", "Bañe bien el chicharrón con la mezcla de salsa soya y terminar cocinar en la sartén hasta que dore.", "Mezcle todos los ingredientes y sirva. Finalice con el cilantro finamente picado."]}, {"title": "Ceviche de mango tommy", "ingredients": ["2 mangos tommy maduros", "1 cebolla morada grande", "2 ají dulce", "30 gr de maní sin sal", "4 limones Tahití", "80 gr de panela en polvo", "20 gr de cilantro", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "Pele el mango y córtelo en cubos.", "Corte la cebolla finamente o en plumas (como más desee).", "Corte los ajís en julianas.", "Mezcle el mango, la cebolla y los ajís con el zumo de limón y panela.", "Deje macerar por 15 minutos.", "Corte finamente el perejil y trocee un poco el maní.", "Adicione el maní y el cilantro al resto de ingredientes, mezcle bien y rectifique el sabor.", "Sirva. Jugo de fresa con yerbabuena y jengibre"]}, {"title": "Jugo de fresa con yerbabuena y jengibre", "ingredients": ["500 gr de fresa", "50 gr de panela en polvo", "20 gr de yerbabuena", "1 raíz pequeña de jengibre", "Hielo"], "procedure": ["Lave y desinfecte los ingredientes.", "Retire la hoja de la fresa y corte de forma irregular.", "Deshoje la yerbabuena.", "Pele el jengibre con la ayuda de una cuchara y corte de forma irregular.", "Lleve todos los ingredientes a la licuadora con agua y procese bien.", "Sirva."]}, {"title": "Filete de pescado en mantequilla de ajo y vegetales salteados", "ingredients": ["5 de filete de tilapia", "1 zanahoria mediana", "1 cebolla roja", "1 cebolla blanca", "1 pimentón rojo", "1 repollo morado pequeño", "2 dientes de ajo", "50 gr de mantequilla sin sal", "25 gr de miel de abejas", "15 ml de salsa de soya", "25 ml de aceite de oliva", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "Corte la zanahoria, las cebollas, el pimentón y el repollo en julianas.", "Caliente una sartén con el aceite y saltee los vegetales, iniciando por el más duro y finalizando con el más blando. Cuando estén salteados, adicione la miel de abejas y la salsa soya. Reserve.", "Corte el ajo finamente.", "Caliente una sartén amplia a fuego bajo y ponga la mantequilla a derretir. Luego adicione el ajo y deje aromatizar. Cuando la mantequilla esté aromatizada ponga los filetes previamente salpimentados.", "Deje los filetes tres minutos por cada lado, hasta que estén cocidos.", "Sirva los filetes y ponga los vegetales encima. Ceviche de pescado y camarones"]}, {"title": "Ceviche de pescado y camarones", "ingredients": ["500 gr filetes de tilapia o pescado blanco fresco", "500 gr de camarones desvenados crudos", "5 limones Tahití", "1 naranja", "2 cebollas rojas", "20 gr de cilantro", "Sal y pimienta", "½ ají rocoto", "1 aguacate papelillo maduro", "100 gr de maíz tostado"], "procedure": ["Lave y desinfecte los ingredientes.", "Corte el pescado en cubos de 2 cms, ponga en un bowl con el camarón e incorpore el zumo de limón y de naranja. Deje reposar por 5 minutos en nevera.", "Mientras reposa el pescado corte la cebolla en plumas.", "Retire las semillas del rocoto y corte en cubos pequeños (brunoise). Tenga cuidado de lavarse muy bien después de haber cortado del rocoto y evite tocarse la piel.", "Corte el aguacate a la mitad, retire la semilla y corte en cubos.", "Deshoje el cilantro y corte finamente.", "Pasado el tiempo de reposo del pescado, adicione la cebolla, el rocoto, el aguacate y el cilantro. Mezcle con cuidado y rectifique la sal y la pimienta.", "Sirva acompañando con el maíz tostado."]}, {"title": "Limonada de albahaca", "ingredients": ["6 limones Tahití", "90 gr de albahaca fresca", "100 gr de panela en polvo", "Hielo"], "procedure": ["Lave y desinfecte los ingredientes.", "Deshoje la albahaca.", "Incorpore las hojas de albahaca en la licuadora con el zumo de limón y los demás ingredientes.", "Licue bien y sirva."]}, {"title": "Lentejas bostonianas", "ingredients": ["250 gr de lentejas", "250 gr de pierna de cerdo", "250 gr de pechuga de pollo", "1 cebolla roja", "250 gr de papa criolla", "1 zanahoria mediana", "30 gr de cilantro fresco", "2 tomates chonto maduros", "25 gr de salsa de tomate", "15 gr de panela en polvo", "25 gr de aceite de girasol", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "Pele la papa y la zanahoria y corte en cubos.", "Ponga a cocinar la lenteja con la papa.", "Hierva abundante agua, realice cortes superficiales en forma de cruz en el lado contrario a donde sale el tallo del tomate. Una vez hierva el agua, sumerja los tomates y déjelos 1 minuto, luego retire del agua y corte la cocción con agua fría. Pele los tomates, retire las semillas y triture.", "Crote la cebolla finamente.", "Corte las distintas carnes en cubos.", "Caliente una sartén con el aceite y sofría las carnes. Cuando estén cocidas, adicione la cebolla, el tomate triturado y la salsa. Deje que se rehogue todos los ingredientes.", "Mezcle las carnes con las lentejas, salpimiente y adicione la panela.", "Sirva y finalice con cilantro finamente picado. Arroz blanco"]}, {"title": "Arroz blanco", "ingredients": ["500 gr de arroz", "1 diente de ajo", "25 gr de aceite de girasol", "Sal y pimienta"], "procedure": ["Corte finamente el ajo.", "Caliente una olla con el aceite y selle el arroz con el ajo.", "Cuando el arroz este un poco perlado, adicione el agua, sal y pimienta.", "Deje hervir, tepe y baje el fuego.", "Cuando seque el agua por completo “peinar” con un tenedor. Calabacín con guacamole"]}, {"title": "Calabacín con guacamole", "ingredients": ["1 calabacín grande", "1 aguacate grande", "1 cebolla blanca", "1 tomate verde", "30 g de cilantro fresco", "1 limón Tahití", "Sal y pimienta"], "procedure": ["Lave y desinfecte los vegetales.", "Corte en láminas delgadas el calabacín.", "Corte la cebolla y el tomate en cubos pequeños, y el cilantro finamente.", "Corte el aguacate por la mitad, retire la semilla y obtenga la pulpa con la ayuda de una cuchara. Triture el aguacate y mezcle con la cebolla, el tomate, el cilantro y el zumo de limón.", "Rellene las láminas de calabacín con el guacamole, haga rollitos y sirva varios por porción. Jugo de maracuyá"]}, {"title": "Jugo de maracuyá", "ingredients": ["750 gr de maracuyá", "Miel o panela en polvo al gusto", "Hielo"], "procedure": ["Corte el maracuyá a la mitad y extraiga la pulpa con la ayuda de una cuchara.", "Lleve la pulpa a la licuadora, con la miel y el hielo.", "Procese bien y sirva."]}, {"title": "Molde de papa con pollo", "ingredients": ["500 gr de papa capira", "1 pechuga de pollo deshuesada", "100g de queso crema", "40 gr de queso parmesano", "2 mazorca dulce", "20 gr de mantequilla", "20 gr de mostaza", "1 pimentón rojo pequeño", "30 ml de aceite de oliva", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "Corte el pollo en cubos pequeños y marine con la mostaza, sal y pimienta. reserve en nevera por 15 minutos.", "Pele la papa y póngala a cocinar con abundante agua y un poco de sal.", "Cuando esté blanda la papa, retire del agua y vuelva puré. Adicione el queso crema, la mantequilla, sal y pimienta. Reserve.", "Escalive el pimentón poniéndolo directamente sobre el fuego y dejando que se queme por completo. Luego retírele la piel y las semillas.", "Corte el pimentón en cubos pequeños (brunoise) y reserve.", "Caliente una sartén con el aceite de oliva y saltee el pollo con el pimentón. Cuando esté bien cocido el pollo, retire del fuego y reserve.", "En una refractaria, ponga una capa de puré y luego una de pollo, y una capa de puré.", "Termine con queso parmesano y lleve al horno a gratinar. Ensalada fantasía"]}, {"title": "Ensalada fantasía", "ingredients": ["1 lechuga batavia", "200 gr de fresa", "1 melón pequeño", "150 gr de palmitos en conserva", "1 mango tommy maduro", "200 ml yogurt de melocotón", "1 limón Tahití", "50 gr de panela en polvo"], "procedure": ["Lave y desinfecte los ingredientes.", "Haga un rollo con varias hojas de lechuga y obre guacamole"]}, {"title": "Papas criollas rostizadas sobre guacamole — para papas rostizadas", "ingredients": ["800 gr de papa criolla pequeña", "Sal y pimienta", "1 cabeza ajo", "15 gr de aceite de girasol", "1 rama de tomillo fresco", "20 gr de mantequilla"], "procedure": ["Pele los lulos.", "Corte la mitad de los lulos en cubos pequeños (brunoise) y disponga en la licuadora.", "Procese bien con agua.", "Adicione al licuado los cubos de lulo y la panela. Mezcle bien y deje macerar.", "Incorpore hielo y zumo de limón. Tiramisú  400 gr de queso crema  400 gr de crema de leche bien fría y con buen contenido de grasa  4 yemas de huevo  25 gr de panela en polvo  200 gr de bizcochos deditos  30 ml de ron  5 ml de esencia de almendras  6 gr de café instantáneo  1 chocolatina de chocolate amargo  10 gr de cocoa en polvo"]}, {"title": "Papas criollas rostizadas sobre guacamole — para salsa de guacamole", "ingredients": ["3 aguacate hass maduros", "25 gr de cilantro", "3 limón Tahití", "1 cebolla de huevo", "1 tomate chonto maduro", "Sal y pimienta"], "procedure": ["Prepare el café en 100 ml de agua y adicione el licor. Reserve.", "Ponga la crema de leche en un bowl frío y bata la crema hasta que se generen surcos (es importante una crema de leche con un contenido graso mayor al 35 % y estar muy fría).", "Agregue las yemas de huevo, la panela, y la mitad del café y la esencia.", "Incorpore el queso crema batiendo lentamente Para el ensamble:", "En una refractaria ponga un poco de crema en la base.", "Luego embeba los deditos de bizcocho en el resto de café y ponga una capa de estos.", "Adicione un poco de chocolate amargo rallado.", "Repita nuevamente el proceso, asegurándose de terminar con crema y cacao.", "Deje reposar en la nevera por al menos una hora."]}, {"title": "Paella mixta", "ingredients": ["500 gr de alas de pollo sin costillar", "300 gr de mejillones", "400 gr de camarón crudo", "500 gr de arroz doña pepa parabolizado", "2 tomates chonto maduros", on el aluminio y deje reposar por 10 minutos.", "Finalice con unas rodajas de limón para decorar e impregnar el aroma. Tinto de verano"], "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wgARCAMgAlgDASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAABAACAwUGAQf/xAAaAQADAQEBAQAAAAAAAAAAAAAAAQIDBAUG/9oADAMBAAIQAxAAAAHACmBy0kqSIHcHreFt6TGqBH3esxOPo83SpLVJJAkkCSJAZb66a8nI3+MihCHqLGFMCuEkqSSQJJAkkCSQJJAkkCSQJJAkkCSQJJBLMI5B04UssqLswDNMEBOc9BLJYgPUfRPa1DcNOOylikZU8XEzqSHqGX2sl+JxeoeY1LUihykRxQxfUPLr6l6j416X5XJGkrEkgSSAr0vEbIRayQuOxdO14JdawMSeDTNJJpJIEkgSSBJIEkgSSBJIEkgSSBd5Ihpc0OYKxLQ7OP0LF9fMme4ApHJ5OImHIgCd3ONPbxJqGccKZjm3LUkzqSD0fRCUuHRosBa2emXlx7JKkPrGg65p9Gizw26wstJLRJJAkuhoZxR4rSUNtTpwyRuVOY6RDKY8DXJJJiSQJJAkkCSQJJAkpURIh6QiIYOJJUJzS0EkxFchnVLb9iq5r6zRSh6zGpljG1aZEwsYGS19qHXSpESkQNGLEClZPBaakmnriD1lNml5Czdb474qot6jbABveM7o85okEZS6pU0krSSQLvOhasIimrRz3OaJ5YUadtqjQRear7in1xSIOqalFihxJDSSBKWIEk4HTRMlTF1xMBQpLZA+SxanY5eNt7E8LTQ5i0FNX9nHLUaHPomDMhTFZYdBpT40FOhkDqTQeKQMFTCRBaakmnpIPVmjummEyD49OTqLev15lX+7+bUsfoZLGHkQSRrSSTEkgSSC7Lo9FLkS41NS2nQp7yoJz1BBuidM9Tc0FRUbisyB8vO0nsfkNKJd4m9hBMFcuK31cQdXEBhFbJmW4pYOI0a1rdVD2RujPIhKBhAhiDKckZBAsjE5JGyhyGeAJJInhJziBxIswEk58WlraKqcAS4qW6ts+TjvqaOz89cl18s1TpsNpcml6plaMdEUEsWiSSYkuhxWtwKlvLSrQud4NzmShBXXdcD5KyEVgfn5s9db2pdGlvlLTuuGRYaO5daVdxg6OIuLYhXW0JJB1c6BzRFJZurVKsqx7adhzj6Hvi6nMMSGi2CZIiWRrg5BPCDn8cCSQdGJECsjkjtSlDGy61JXOs5mzMd9lk7yhch21Ro6gCgsqsCIm9aauKkkkHdplN8FvytqGiAZYppJRBM8QkJmSuTzgl9nmnkSW8aR1pl5NZt9xRVFfHO55y2gJFI9rC2ZYHc5MY7F2SNdVHO8cm5r3AxFRollHkHOoXTcrVGIhxQpM7mODkU0QPdx4MXWg4QoYKyIqxuauw7o5rGq5Q6G7Fuo0sawiwzvL6GtstufIVp4FKZPaELm9af1iZfn1ZY5GtaiWNjRvbzoO0IHoNTh3afNYbarzX1uXp5/Dnet1EX59dXObz2Jz59URI4eas5HRlUHvgJEZKASzKhbbJpi949CMJMwKBWQOrTh3sNHHMTgRLRscXGD5I5UP7zolG9oSdZwHta0JIl0e7tKwy4y86qUyFUpOwJrBcum8Oqb9GfloXaYWOat9jpGAG3VOjMv2gg8pxyc2 , "— Para la salsa bbq de mango y uchuva —", "2 mangos tommy maduros", "400 gr de uchuva", "80 gr de salsa soya", "200 gr de panela en polvo", "100 gr de pasta de tomate", "Sal y pimienta"], "procedure": ["Limpie las costillas; para ello, con la ayuda de un cuchillo rompa la membrana que trae la costilla adherida por la parte de atrás del hueso y jale con ayuda de un paño o servilleta hasta retirar por completo.", "Disponga las costillas en una olla a presión con la paprika, el ajo y agua hasta que las sobre cubra.", "Cierre la olla y llévela al fuego. En el momento que suene la válvula de la olla, cuente 10 minutos y retire del fuego.", "Retire las costillas con cuidado sobre una bandeja y deje reposar.", "Bañe con la salsa bbq de mango y uchuva. Opcional, separe cada hueso y marine con la paprika, cebolla y ajo en polvo. Caliente una sartén con un poco de aceite, lleve a dorar y luego deje que se cocinen en sus propios jugos o agregue un poco de líquido como el zumo de una naranja hasta que se cocine por completo."]}, {"title": "Puré de papa", "ingredients": ["4 papas nevadas", "20 gr de mantequilla", "100 ml de leche", "80 ml de crema de leche", "1 gr de nuez moscada", "Sal y pimienta"], "procedure": ["Lave y desinfecte las papas.", "Cocine las papas en una olla con agua y sal (si desea puede adicionar hierbas aromáticas).", "Retire las papas del agua cuando estén blandas.", "Pele las papas calientes y triture con la ayuda de un prensa puré o tenedor.", "Agregue la crema de leche, leche, mantequilla, nuez moscada y pimienta.", "Mezcle bien y rectifique el sabor. Nota: es muy importante triturar el puré con la papa caliente y sin darle mucho movimiento, para no activar el almidón. De esta manera se evita que tome textura de chicle. Se puede pasar por el colador, para que quede con una textura más lisa. Ensalada italiana"]}, {"title": "Ensalada italiana", "ingredients": ["1 lechuga morada", "300 gr de queso mozzarella en bloque", "300 gr de tomate cherry", "60 gr d e cerdo o cabeza de cañón", "10 gr de cebolla en polvo", "5 dientes de ajo", "5 gr de chile molido (si no puede encontrarlo, use una cucharita de"], "procedure": ["Corte la carne en cubos lo más parejos posibles.", "Ponga la carne en una olla y adicione el resto de ingredientes.", "Mezcle bien y adicione un poco de agua.", "Lleve a cocinar con la olla tapada por 30 minutos a fuego bajo."]}, {"title": "Bowl de arroz con cilantro con pulled pork — para coleslaw", "ingredients": ["1 repollo morado", "1 zanahoria", "2 manzanas verdes", "200 gr de mayonesa light", "250 gr de crema de leche baja en grasa", "3 limones tahití", "1 cebolla de huevo blanca", "100 gr de nueces de brasil o maní", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "Corte el repollo en chiffonade (tiras) tratando que quede en hilos, la zanahoria y la manzana en julianas muy delgadas, la cebolla en plumas de igual manera, delgadas.", "Adicione la crema y la mayonesa y mezcle muy bien.", "Agregue las nueces de Brasil previamente troceadas.", "Adicione el zumo de limón, sal y pimienta. Mezcle bien todos"]}, {"title": "Bowl de arroz con cilantro con pulled pork — para montaje de bowl", "ingredients": ["2 limones tahití", "1 aguacate maduro", "50 gr de maicitos"], "procedure": ["Lave y desinfecte los ingredientes.", "Corte el limón en gajos y reserve.", "Abra el aguacate, retire la semilla y corte en cubos. Reserve.", "Monte el bowl sirviendo una base del arroz, luego la ensalada a un lado, el pulled pork a otro lado y finalice con el aguacate, el limón y los maicitos."]}, {"title": "Bowl de quínoa y salmón con salsa de yogur — para base de quinua y salmón", "ingredients": ["500 gr de quínoa", "500 gr de salmón (100 gr por persona) o trucha", "4 de aguacates", "500 gr de espinacas", "150 gr de garbanzos (remojado desde la noche anterior)", "250 de espárragos verdes o habichuelas", "4 rabanitos", "Sal y pimienta", "80 ml de aceite de girasol"], "procedure": ["Deje los garbanzos remojando desde la noche anterior con suficiente agua. Al momento de usarlos, deseche el agua de remojo y añada agua limpia. Lleve los garbanzos a cocinar hasta que queden blandos pero firmes. Reserve.", "Lave muy bien la quínoa hasta que el agua salga transparente. Escurra.", "Prepare la quinua como si fuera arroz, por una parte de quinua dos de agua. La puede preparar con caldo de pollo o de verduras o agua y un poco de sal. Reserve.", "Aparte, lave y desinfecte los vegetales.", "Si va a preparar los espárragos, retire aproximadamente dos centímetros de la base y luego con la ayuda de un pelapapas retire la piel que cubre la parte lisa. Si va a preparar habichuelas, retire las puntas. Caliente una sartén con un poco de aceite y saltee los espárragos o habichuelas. Reserve.", "Abra el aguacate, retire la semilla y corte en cubos. Reserve.", "Obtenga rebanadas de los rabanitos. Reserve.", "Deshoje las espinacas y reserve.", "Salpimiente los filetes de salmón y lleve a cocer en la misma sartén de los espárragos. Cocine hasta el punto deseado y reserve."]}, {"title": "Bowl de quínoa y salmón con salsa de yogur — para salsa de yogur", "ingredients": ["60 gr de pasta tahini (ver página 14)", "30 ml de vinagre de manzana", "100 ml de aceite de sésamo", "30 ml de salsa de soya", "125 gr de yogur natural", "Sal y pimienta"], "procedure": ["Mezcle la pasta de tahini con 30 ml de agua caliente y el aceite. Mezcle bien y deje enfriar por completo.", "Agregue el resto de ingredientes.", "Procese en la licuadora hasta obtener una mezcla homogénea. Reserve. Sirva una cama de quinua, luego disponga los garbanzos, los espárragos o habichuelas salteadas, la espinaca, el aguacate y los rabanitos. Finalice con el filete de salmón (este lo puede añadir desmenuzado). Acompañe de la salsa. Bowl de pollo a la parmesana con berenjena y rúcula"]}, {"title": "Bowl de pollo a la parmesana con berenjena y rúcula", "ingredients": ["80 ml de aceite de oliva", "150 ml de aceite de girasol", "3 berenjenas grandes", "50 gr de albahaca fresca", "1 cebolla", "3 tomates chonto maduros", "20 ml de vinagre de manzana", "100 gr de queso parmesano", "2 taza de panko o polvo de biscocho", "250 gr de harina de trigo", "5 huevos", "250 queso mozzarella en bloque", "500 gr de rúcula", "Papel parafinado", "Sal y pimienta", "5 filetes de pollo"], "procedure": ["Lave y desinfecte los ingredientes.", "Corte las berenjenas en rodajas delgadas, la cebolla en cubos pequeños (brunoise) y los tomates en dados pequeños.", "Caliente una sartén con un poco de aceite de oliva y lleve las berenjenas a asar de 2 a 3 minutos por cada lado. Una vez que esté dorada y tierna, reserve en un plato.", "Aparte, deshoje la albahaca y corte en tiras (chiffonade) delgadas. Mezcle la albahaca cortada con la cebolla, el tomate, el vinagre y dos cucharadas de aceite en un recipiente pequeño. Reserve.", "Precaliente el horno a 200°c.", "Cubra la bandeja de horno con papel parafinado.", "En un plato, mezcle el parmesano y el panko. En otro plato ponga la harina.", "Bata los huevos con un poco de sal y una cucharada de huevo en un plato poco profundo.", "Salpimiente los filetes de pollo y enharínelos. Luego pase por el huevo batido y finalmente por el panko. Reserve en un plato.", "Caliente una sartén con el aceite de girasol y sofría el pollo hasta que quede bien cocido.", "Calentamos el aceite restante en una sartén a fuego medio-alto. Freímos el pollo durante 3 a 4 minutos por cada lado o hasta que esté dorado y los introducimos en la bandeja del horno ya preparada.", "Ralle el mozzarella y espolvoree por encima. Hornee durante 5 minutos o hasta que el queso se haya derretido. Retire del horno y porcione en julianas.", "Trocee la rúcula con la mano.", "Ponga una cama de rúcula, luego las rodajas de berenjena, la mezcla de vegetales y finalice con el pollo cortado."]}, {"title": "Buddha Bowl", "ingredients": ["100 gr de garbanzo (remojado desde la noche anterior)", "100 gr de tomate Cherry", "1 berenjena pequeña", "100 gr de quinua", "100 gr de repollo morado", "50 gr de hojas de kale o colchina o cogollos de lechuga", "12 gr de nueces del Brasil o almendras", "1 aguacate hass maduro", "5 gr de paprika", "50 ml salsa de soya", "50 ml miel de abejas", "10 gr de ajonjolí", "5 gr de orégano seco", "50 ml aceite de oliva", "Sal y pimienta"], "procedure": ["Deje los garbanzos remojando desde la noche anterior con suficiente agua. Al momento de usarlos, deseche el agua de remojo y añada agua limpia. Lleve los garbanzos a cocinar hasta que queden blandos pero firmes.", "Retire los garbanzos de la olla y ponga en una bandeja de horno. Bañe con un chorro de aceite de oliva y hornee por 10 minutos a 180°c o en la sartén hasta que estén crocantes. Reserve.", "Aparte, ponga a cocinar la quinua como si fuera arroz (dos de agua por una de quinua). Reserve.", "Trocee un poco las nueces de y lleve a una sartén a dorar levemente. Reserve.", "Prepare la vinagreta mezclando en un bowl la sala soya, la miel y el ajonjolí. Pruebe y ajuste el sabor con sal y pimienta.", "Lave y desinfecte los vegetales.", "Corte la berenjena en cubos medianos y lleve a un recipiente con agua y sal (para desamargar). Deje allí durante 15 minutos, escurra y saltee en una sartén caliente con aceite, orégano y paprika.", "Corte los tomates a la mitad, el repollo en tiras delgadas y el aguacate en cubos. Reserve.", "Trocee el kale con la mano en porciones del tamaño de un bocado. Reserve.", "Cuando tenga todos los ingredientes listos, arme el bowl colocando cada ingrediente por separado y finalizando con la vinagreta. Bowl con falafel y base mediterránea."]}, {"title": "Buddha Bowl — para falafel de garbanzos y lentejas y mermelada de", "ingredients": ["500 gr de garbanzos (remojado desde la noche anterior)", "200 gr de lenteja", "50 gr de cilantro", "50 gr de perejil crespo", "20 gr de levadura en polvo", "1 cebolla de huevo blanca", "5 dientes de ajo", "100 gr de harina de trigo o harina de avena", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "Deje los garbanzos remojando desde la noche anterior con suficiente agua. Al momento de usarlos, deseche el agua de remojo. Reserve.", "Cocine las lentejas.", "Lleve las lentejas cocidas y los garbanzos remojados al procesados o maquina de moler. Procese bien junto, el perejil, el cilantro, la cebolla, y el ajo.", "Adicione la harina, la levadura y la sal y pimienta. mezcle bien y deje reposar la masa 1 hora.", "Pasado este tiempo, de forma a los falafel y lleve al horno a 180ºc por 15 minutos o fría en aceite.", "Para la mermelada, ponga las uchuvas, la miel y un poco de agua en una sartén. Lleve a fuego bajo hasta que la uchuva se empiece a desintegrar.", "Retire del fuego.", "Reserve para servir con el bowl."]}, {"title": "Buddha Bowl — para mermelada de uchuvas", "ingredients": ["250 gr de uchuvas", "250 gr de miel de abejas"], "procedure": ["Lave y desinfecte los ingredientes.", "Trocee el kale con la mano en porciones del tamaño de un bocado. Reserve.", "Corte el queso mozzarella en cubos. Reserve.", "Corte las aceitunas en rodajas y el tomate en mitades. Reserve.", "Corte la cebolla y los pepinillos en cubos pequeños (brunoise) y mezcle con las alcaparras, el zumo de limón y el yogurt o mayonesa. Salpimiente y reserve.", "Mezcle todos los ingredientes y sirva con los falafel."]}, {"title": "Buddha Bowl — para base mediterránea", "ingredients": ["500 gr de kale", "200 gr de queso mozzarella en bloque", "125 gr de aceitunas negras", "40 gr de albahaca fresca", "250 gr de tomate Cherry", "125 gr de alcaparras", "400 gr de yogur griego o mayonesa light", "1 cebolla morada", "125 gr de pepinillos", "3 limón tahití"], "procedure": ["Lave y desinfecte los ingredientes.", "Pele la zanahoria y corte en julianas muy delgadas.", "Abra el pimentón, retire las venas y semillas. Corte en julianas delgadas.", "Retire las venas del apio y corte en medias lunas.", "Corte el calabacín en medias lunas delgadas, la cebolla en plumas delgadas, los tomates en mitades y los palmitos en julianas delgadas. Reserve cada vegetal por separado.", "Corte el jamón en julianas y reserve.", "Lave la quinua hasta que el agua salga transparente.", "Prepare la quinua como si fuera arroz, por una parte de quinua dos de agua. La puede preparar con caldo de pollo o de verduras o agua y un poco de sal. Reserve.", "Caliente una sartén ancha o un wok y dore levemente el maní. Retire y reserve.", "Caliente nuevamente la sartén o wok con 2 cucharadas de aceite.", "Comience a saltear la zanahoria (por su dureza) y deje dorar por 2 minutos. Continue adicionando el pimentón y dejando por dos minutos más. Siga con el apio, la cebolla y el zucchini o calabacín. Finalice con los tomates Cherry, los palmitos y el jamón.", "Añada la salsa soya, la miel y la pimienta. Pruebe y en caso de requerir sal, adicione.", "Sirva una base de quinua, luego sirva los vegetales salteados y finalice con el maní y el cilantro finamente cortado. Baba Ganoush"]}, {"title": "Bowl de quinoa y vegetales", "ingredients": ["500 gr de quinua", "1 zanahoria", "100 gr de apio", "1 cebolla de huevo blanca", "1 zucchini", "20 gr de aceite ajonjolí o aceite de oliva", "50 gr de cilantro", "250 gr de tomates Cherry", "1 pimentón rojo", "250 gr de jamón vegetariano", "125 gr de palmitos enlatados", "30 gr de miel de abejas", "100 gr de maní", "Sal y pimienta"], "procedure": ["Lleve el ajonjolí a una sartén caliente a fuego medio y dore las semillas sin adicionar aceite.", "Lleve las semillas tostadas a una licuadora con el aceite.", "Procese bien hasta obtener una pasta homogénea.", "Reserve."]}, {"title": "Baba Ganoush", "ingredients": ["1 berenjena", "80 gr de tahini", "1 limón tahití", "50 gr de perejil crespo", "60 ml de aceite de oliva", "5 gr de comino", "1 diente de ajo", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "Pinche las berenjenas con un cuchillo.", "Lleve las berenjenas a un horno precalentado a 180 °C, y hornee por 40 minutos hasta que estén suaves y tiernas.", "Retire del horno y déjelas enfriar. Descarne las berenjenas y llévelas junto al tahini, zumo de limón, aceite de oliva, comino y ajo a un procesador de alimentos. Procese bien hasta tener una textura pareja y homogénea.", "Adicione el perejil finamente picado, mezcle y reserve.", "Acompañe con pan pita. Champiñones marinados en especias"]}, {"title": "Baba Ganoush — para tahini", "ingredients": ["100 gr de semillas de ajonjolí", "40 ml de aceite de oliva"], "procedure": ["Lave y desinfecte los ingredientes que lo requieran.", "Corte el ajo y el perejil finamente.", "Si desea, puede cortar los champiñones en láminas.", "Lleve todos los ingredientes a la bolsa o recipiente.", "Mezcle bien para que se incorporen los sabores.", "Caliente una sartén y saltee para que se doren.", "Acompañe un bowl con esta preparación."]}, {"title": "Champiñones marinados en especias", "ingredients": ["500 gr de champiñón fresco entero", "1 bolsa plástica", "Sal y pimienta", "20 gr de paprika", "5 gr de ají en polvo molido (opcional)", "100 ml de vinagre balsámico o de frutas", "100 gr de aceite de oliva", "10 gr de tomillo", "3 dientes de ajo", "10 gr de orégano seco", "50 gr de perejil crespo", "Sal y pimienta"], "procedure": []}], "recipe_count": 21}, {"title": "Recetario: sabores de la cocina mexicana", "source": "Recetario actualizado de sabores de la cocina mexicana.pdf", "recipes": [{"title": "Quesadillas de pollo", "ingredients": ["10 tortillas de harina talla L", "1 pechuga de pollo", "500 gr de queso mozzarella en bloque", "1000 gr de papa capira", "200 ml de aceite de girasol"], "procedure": ["Lave y desinfecte los ingredientes.", "Pele las papas y corte en cubos de 50 mm de cada lado.", "Cocine la papa en abundante agua con sal hasta que estén tiernas. Reserve.", "Corte la pechuga en cubos y salpimiente. Lleve a asar en una sartén caliente con un poco de aceite.", "Corte el queso en cubos de 5 mm de lado.", "Disponga una tortilla cruda sobre la mesada. Pincele los bordes con agua y disponga el pollo y el queso sobre una de las mitades, dejando un borde para cerrar.", "Cierre la tortilla formando una media luna.", "Lleve a hornear o a freír en aceite."]}, {"title": "Tortas de cochinita pibill — para cochinita", "ingredients": ["1000 gr de cabeza de cañón", "5 gr de paprika", "5 gr de achiote en polvo", "1000 ml de jugo de naranja", "3 gr comino en polvo", "5 gr de orégano", "Sal y pimienta", "50 gr de panela en polvo", "5 dientes de ajo", "1 jalapeño", "50 gr rúgula", "1 hoja de bijhao", "30 gr de fécula de maíz", "5 panes de hamburguesa"], "procedure": ["En la olla presión, disponga la hoja de bijhao y sobre esta ponga la carne, el zumo de naranja, el ajo, el jalapeño, las especias, panela, sal y pimienta.", "Cocine durante 50 minutos aproximadamente.", "Una vez pasado el tiempo de cocción, retire la carne y desmeche.", "Diluya en ¼ de taza de agua la fécula de maíz y agregue en forma de hilo al caldo de cocción mientras remueve para evitar grumos.", "Finalmente, bañe la carne con la salsa obtenida."]}, {"title": "Tortas de cochinita pibill — para cebollas encurtidas", "ingredients": ["2 cebollas moradas", "4 limón Tahití", "Sal y pimienta"], "procedure": ["Lave y desinfecte las cebollas.", "Corte las cebollas en plumas y deje remojando durante 5 minutos en agua (puede adicionarle un poco de vinagre).", "Pasado este tiempo, retire el agua y agregue zumo de limón, sal y pimienta."]}, {"title": "Tortas de cochinita pibill — para guacamole", "ingredients": ["1 aguacate papelillo maduro", "10 gr de cilantro fresco", "3 limón Tahití", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "Abra el aguacate, retire la semilla y obtenga la pulpa.", "Triture el aguacate.", "Pique finamente el cilantro y agregue al aguacate.", "Finalice con zumo de limón, sal y pimienta. Montaje:", "Unte el pan con guacamole y sobre este, ponga la rúgula limpia, la cochinita y las cebollas encurtidas.", "Disfrute. Papas al honor con salsa de tomatillo verde"]}, {"title": "Papas al honor con salsa de tomatillo verde", "ingredients": ["5 papas capira", "500 gr de tomatillo verde", "1 cebolla blanca", "3 chile de árbol", "30 ml de aceite de girasol", "2 dientes de ajo", "20 gr de cilantro", "Sal y pimienta", "200 gr de queso crema"], "procedure": ["Lave y desinfecte los ingredientes.", "Corte la papa en cascos.", "Sazone con sal, pimienta y un poco de aceite girasol.", "Disponga sobre una lata de horno y hornee por 20 minutos a 200°C. Reserve.", "Corte la cebolla y el tomatillo en octavos y disponga sobre una bandeja de horno bañados con aceite y sal.", "Lleve a hornear para tatemar por 20 minutos a 200°C.", "Pasado el tiempo de horneo, retire el tomate y la cebolla del horno y lleve a la licuadora con el queso crema. Procese bien y rectifique el sabor.", "Sirva las papas bañadas con la salsa. Jugo de tamarindo"], "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wgARCAMgAlgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAgMAAQQFBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAevckXdUHa7GEsqYa5D2Z2K4k3DrUY003K6LIODYRDFPRkbIwaWpGspTEpAFVyrS1esxRo1M2HTj3mnI0ayIuYKebM1NNGVNMEhgWpFNWUQXKdDCMWYyVRdVCUNJKqEoqKurKqQCSFRdylKlHYkWYEHYEEayhpLJWEoh1rOCICUyAgpUgyWQwk3FyrtYSSxSJZ5sTpC5x5duLpMWV6emK1L0pb16ZRspKsHLFrasXLqy5dixYCiVkVZWALKAlwXRiVLhKlFSol2JAy4ZDAlODYZLIKwsYQGWQEGSyG2JSnYXDCUdNtZQZKNTsYXKtGWs5QMblsgma+7iY+dq524pZl15sfTc23UU1dHUKWwIXR3WenBZUuxUOioRFXLBqxq6K4SD1i4dVVHQqFSCYkSSGOVSnBgdgYRiwlykK6IhSKZLKGwCW2KsdF2jTWanAuGWBF2MUoJ5C9cXTjDPcpTJ0yGitYJHeNQrvNsCqFCwKVLDUNTRFEN2WLKKZRwuiXVgUKKjFg0AKIQRIaoSiAdQKSHOu7W7GwrGwyAhkq7LIKGWooZa7VxKuG2pgZAQdhBhLIbaiU7CQRLpWovIjFJLeZZEjHr051RQcbK7LOrCDJVOmpmRqTqCUbZkrSgITgJw0WtwgwgKlBR0JQIGNCLBF1cslFCpUOfAtTsSCISDsL alsa chipotle.jpeg"}, {"title": "Sopa de tortilla", "ingredients": ["2000 gr de tomate chonto maduro", "1 cabeza de ajo", "3 cebollas de huevo blancas", "10 tortillas de tortillas de maíz", "20 gr de cilantro", "100 gr de crema agria", "250 gr de queso blanco", "2 aguacates hass maduros", "50 ml de aceite de girasol", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "Corte los tomates y las cebollas en mitades.", "Pele los dientes de ajo.", "Ponga el ajo, el tomate y la cebolla una refractaria. Adicione un chorro de aceite y un poco de sal y pimienta.", "Lleve al horno por 20 minutos a 200°C.", "Pasado el tiempo de horneo, retire y lleve a la licuadora. Procese bien.", "Lleve el procesado a una olla y deje cocinar por 15 minutos.", "Corte las tortillas en tiras y lleve a sofreír.", "Sirva la sopa y termine con las tortillas fritas, el queso en cubos, la crema agria, el aguacate en cubos y el cilantro finamente cortado. Jugo de mora con flor de Jamaica"]}, {"title": "Jugo de mora con flor de Jamaica", "ingredients": ["20 gr de flores de Jamaica", "250 gr de moras", "Miel al gusto"], "procedure": ["Caliente agua y adicione las flores de Jamaica. Cocine por 10 minutos aproximadamente.", "Retire del fuego y deje enfriar.", "Licue las moras con el agua de Jamaica.", "Endulce de acuerdo a su gusto y sirva frío."]}, {"title": "Pollo al pipián", "ingredients": ["3 pechugas de pollo", "2 chiles anchos desvenados", "25 gr de maní", "50 gr ajonjolí", "50 gr semillas de calabaza limpia", "3 de tomates", "1 cebolla de huevo mediana", "4 dientes de ajo", "120 ml de aceite girasol", "Caldo de pollo (se hace con las carcasas)", "500 gr de arroz", "2 clavos de olor", "5 gr de comino"], "procedure": ["Deshuese las pechugas y con los huesos realice un caldo de pollo.", "Corte las pechugas las pechugas de acuerdo al tamaño de la porción y sazone con sal y pimienta.", "Caliente una sartén amplia con el aceite y selle el pollo. Reserve.", "Caliente nuevamente la sa elo"], "procedure": ["Remoje el arroz por lo menos durante 8 horas.", "Pasado el tiempo de remojo, lleve a la licuadora con la canela y la miel.", "Procese bien y cole.", "Sirva con hielo."]}, {"title": "Filete de pescado en salsa de mango picante al papillote", "ingredients": ["4 filetes de pescado (róbalo, merluza, corvina)", "2 mangos maduros", "3 dientes de ajo", "Pimienta y sal", "1 chile serrano", "30 gr de panela en polvo", "30 ml de vinagre blanco o de frutas", "1 calabacín", "1 cebolla roja", "1 pimentón rojo", "150 gr de champiñones", "2 limón tahití", "50 ml de aceite de girasol", "Papel aluminio"], "procedure": ["Lave y desinfecte los ingredientes.", "Sazone los filetes de pescado con sal, pimienta y los ajos finamente cortados. Reserve.", "Corte el calabacín en julianas, la cebolla en plumas y el champiñón en láminas.", "Pele el mango, retire la semilla y llévelo a la licuadora junto con el chile serrano, la panela y el vinagre. Agregue una pizca de sal y pimienta.", "Licue bien y tamice.", "Caliente una sartén a fuego medio y adicione el licuado. Deje que hierva por unos minutos y reserve.", "Corte un cuadro de papel aluminio, engrase con un poco de aceite, coloque uno de los filetes de pescado y encima colóquele un poco de los vegetales.", "Agregue una cucharadita de aceite, una cucharadita de jugo de limón y una de la salsa picante de mango.", "Cierre el aluminio en forma de sobre, dejando la envoltura floja.", "Lleve al horno precalentado a 190°c por 15 minutos.", "Retire del horno y abra con cuidado la envoltura. Sirva con la envoltura. Burritos de pollo"]}, {"title": "Burritos de pollo", "ingredients": ["2 pechugas de pollo descongeladas", "250 gr de frijol caraota remojado", "250 gr de arroz", "2 dientes de ajo", "1 lechuga batavia", "2 aguacates hass grandes y maduros", "2 limón Tahití", "30 gr de cilantro", "Sal y pimienta", "500 gr de queso cheddar", "10 tortillas de harina extragrandes", "250 gr crema agria"], "procedure": ["Remoje el frijol arroz.", "Mida el agua teniendo en cuenta el jugo de tomate.", "Cuando el arroz esté nacrado, adicione el agua y termine de cocinar de forma tradicional. Ensalada de elote"]}, {"title": "Ensalada de elote", "ingredients": ["4 mazorcas dulces", "30 ml de aceite de girasol", "50 ml de salsa inglesa", "50 gr de pasta de tomate", "20 gr de panela en polvo", "1 cebolla morada", "250 gr de uvas pasas", "1 pimentón verde", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "En un recipiente, mezcle la salsa inglesa, la pasta de tomate, la panela, sal y pimienta al gusto. Reserve.", "Corte la cebolla y el pimentón en cubos pequeños (brunoise). Luego, caliente una sartén con el aceite y lleve a sofreír.", "Desgrane la mazorca y adicione al sofrito.", "Cuando el sofrito esta levemente dorado, adicione la mezcla inicial.", "Deje cocinar un momento y retire del fuego. Jugo de fresa y hierbabuena"]}, {"title": "Jugo de fresa y hierbabuena", "ingredients": ["1000 gr de pulpa de fresa", "Panela instantánea", "30 gr de hierbabuena", "Hielo", "1500 ml de agua"], "procedure": ["Lave y desinfecte la hierbabuena.", "Lleve la pulpas a la licuadora con el agua, un poco de hielo y panela al gusto.", "Licue a alta velocidad.", "Al finalizar, y procese nuevamente.", "Sirva sin colar para no botar la fibra."]}, {"title": "Envueltos de carne con verduras", "ingredients": ["1000 gr de cabeza de cañón de cerdo", "1 zanahoria cortadas en bastones a lo largo y blanqueados", "250 gr de habichuelas largo y blanqueados", "250 gr tocineta", "3 mazorcas dulces", "100 gr de mantequilla", "3 limón Tahití (75 ml de zumo de limón)", "Sal y pimienta"], "procedure": ["Lave y desinfecte los ingredientes.", "Pele la zanahoria, corte en bastones delgados y lleve a blanquear por 2 minutos en una olla con agua hirviendo. Retire del agua y enfríe rápidamente.", "Despunte las habichuelas y repita el mismo proceso de las zanahorias.", "Corte la carne en tiras y salpimiente.", "Acomode de tres e ble crema en bloque", "2 chile pasilla", "Aceite de girasol c/n", "Sal y pimienta"], "procedure": ["Remoje los frijoles en un recipiente con abundante agua un día antes o por lo menos con 8 horas de anterioridad.", "Deseche el agua de remojo de los frijoles y lleve a una olla a presión con tres tazas de agua y un poco de sal.", "Una vez cocidos, licue utilizando una parte del caldo con el que los cocino. Reserve.", "Lave y desinfecte los vegetales.", "Caliente una sartén o plancha, ase los tomates y retire la piel.", "Lleve los tomates a la licuadora con ajo y cebolla. Procese bien y lleve a una sartén a sofreír.", "Luego adicione agua y las carcasas de pollo. Deje cocer bien y adicione el frijol licuado.", "Deje hervir a fuego lento durante un par de minutos.", "Sazone con un poco de sal y pimienta.", "Aparte, corte las tortillas en forma de tiritas y fría en una sartén con poco de aceite.", "Saltee el chile en una sartén y corte en julianas.", "Una vez que la sopa esté cocida y sazonada, sirva en los platos y finalice con las julianas de chile, las tortillas fritas y queso rallado."], "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wgARCAMgAlgDASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAAAAECAwQFBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAY1hXhu0rHajhAVAAABClQIAQUAEAASgAAQUQAAEEFEUAEEAURRQAkbbJqXQxZc1fvRakkNm5LlWNB9UJLrrKEeotZs9sIXvSwuUdHNla8lhbJHwNRzYgikj9WZ5IHcrK1i4riM3POnRSXdySGaxRAUQRRBVEBUAAEBBVEKVABAAABFBFQBXIwt3UyE6m1ccY7qYWsLQ3rWbh2tVcqU065sT3Cx1bVPcRQ65AAAAAAARQZepzRbWu1bLKzcJoUbSIpuDmqKCQAVwNiSTl0hVzLHK1QBBRAUQFEBRBFERVEBRXDEsypRXSsWZE/Q3JOdsdA6MKzomJDaScFU66r1LVOy5I13Hqo1IcNLXI1Ap2K/TmAvTIAAoIoAAAAj2uHCFiIJKIoNR6DVVRo4GihycRDy6KkT7JBqiiFKIoDnpEXr0YbultJy03VyRytnfTnMme+qV3WG213C9liSF2a5IVhwxcyWaq5bZG7dhpWa+s2n13Y6SkaEiRpUiRly6J6ay1VKQAAAFQAUQUEUUAQEUBFQ a.", "250 gr de aceite girasol."], "procedure": ["Remoje los frijoles en abundante agua desde el día anterior o por lo menos durante 8 horas antes. Deseche el agua de remojo y adicione agua limpia. lleve a cocinar hasta que estén bien cocidos.", "Corte la cebolla y el tomate en cubos pequeños (brunoise).", "Caliente una sartén con un poco de aceite y adicione la cebolla y el tomate. Sofría un poco y añada la carne, los frijoles cocidos y la pasta de tomate. Deje cocinar tratando de ir desbaratando los grumos de carne.", "Sazone con sal y pimienta.", "Aparte, prepare un guacamole abriendo el aguacate y retirando la semilla. Triture la pulpa con el zumo de limón, sal y pimienta. reserve.", "En una refractaria, ponga los nachos, el chili con carne, la salsa de queso y algunos jalapeños finamente picados. Finalice con el cilantro finamente picado y acompañe con el guacamole."]}, {"title": "Jugo de mora, fresa y limón", "ingredients": ["250 gr de mora", "750 gr de fresa", "6 limones Tahití", "100 gr de panela en polvo", "1200 ml de agua", "Hielo"], "procedure": ["Lave y desinfecte las frutas.", "Retire las hojas y lleve a la licuadora con agua y panela.", "Procese bien y cole.", "Adicione el jugo de limón.", "Sirva frio con hielo."]}, {"title": "Molde de frijol refrito", "ingredients": ["250 gr de frijol caraota remojado", "250 gr de queso mozzarella tajado", "1 diente de ajo", "1 gr de comino", "1 aguacate hass maduro", "40 gr de cilantro", "3 tomates chonto maduros", "1 cebolla blanca", "7 limones tahití", "10 tortillas de preferencia", "250 gr de crema agria", "Sal y pimienta"], "procedure": ["Remoje los frijoles en abundante agua desde el día anterior o por lo menos 8 horas antes. Deseche el agua de remojo y adicione agua limpia para llevar a cocinar con la cebolla, el ajo y el comino por 15 minutos en olla a presión.", "Una vez cocidos los frijoles, retire de la olla a presión y lleve a una sartén con un poco de aceite. Sofría los frijoles, aplaste y sazone con sal. Reserve.", "Aparte, licue ingredientes del pollo al pastor con el jugo de naranja, mezclar muy bien.", "Corte la carne en porciones delgadas. Adobe con el licuado anterior y ponga en una fuente de horno.", "Lleve a hornear a 200 c° por 20 minutos. (también se puede llevar a la olla a presión durante 20 minutos).", "Desmeche el cerdo.", "En una refractaria, ponga en la base el frijol refrito, luego la mitad del queso, luego cerdo y finalmente el resto del queso.", "Lleve al horno durante 10 minutos a 200° c.", "Aparte, prepare un pico de gallo cortando la cebolla y el tomate en cubos pequeños (brunoise) y el cilantro finamente. Mezcle con el zumo de limón (reserve un limón para el guacamole) y sazone con sal. Reserve.", "Abra el aguacate, retire la semilla y triture la pulpa. Adicione limón, sal y pimienta. Reserve.", "Servir el molde con el guacamole, pico de gallo y crema agria. Acompañe con la tortilla de preferencia."]}, {"title": "Molde de frijol refrito — para cerdo al pastor", "ingredients": ["1000 gr de lomo de cerdo", "2 chiles guajillo", "1 chiles anchos", "1 chiles chipotle en adobo", "4 dientes de ajo", "1 cebolla roja", "20 ml de vinagre de frutas", "250 ml de jugo de naranja", "200 gr de pulpa de piña", "3 clavos de olor", "5 gr de comino", "5 gr de orégano", "10 gr de achiote en polvo", "1 tomate rojo grande", "Sal y pimienta"], "procedure": ["Corte la sandía y extraiga la pulpa.", "Lleve a la licuadora con un poco de agua y dé unos pulsos rápidos para separar las semillas sin romperlas.", "Tamice el jugo.", "Adicione panela y el zumo de limón.", "Sirva frio."]}, {"title": "Limonada de sandia", "ingredients": ["1 sandia", "10 limones Tahití", "200 gr de panela en polvo", "1000 ml de agua", "Hielo"], "procedure": []}], "recipe_count": 29}, {"title": "Recetario: preparaciones con olla airfryer", "source": "Recetario_Preparaciones con olla airfryer (1).pdf", "recipes": [{"title": "Fritata", "ingredients": ["½ plátano maduro", "½ pimiento maduro", "½ toma tro.", "Incorpore la cebolla, ajo y el pimentón. Deje sofreír por unos dos minutos y adicione el tomate.", "Deje rehogar un momento e incorpore la arveja, la pasta de tomate y el vino.", "Deje que se evapore un poco el vino y agregue el arroz en la paellera formando una cruz.", "Luego, comience a esparcir para que ocupe todo el fondo de la paellera. Tratando de que quede nivelado.", "Adicione el caldo preparado al inicio. Este debe de tapar el arroz y pasarlo un poco.", "Salpimiente.", "Deje cocinar a fuego alto los primeros 5 minutos y luego ponga en bajo el tiempo restante (unos 10 a 15 minutos más).", "Cuando esté finalizando su cocción, incorpore los mariscos, comenzando con los mejillones clavándolos desde su base, luego los camarones, seguido de los anillos de calamar y finalizando con los palmitos troceados.", "Pasado el tiempo de cocción, tape con el aluminio y deje reposar por 10 minutos.", "Finalice con unas rodajas de limón para decorar e impregnar el aroma. Sangría de vino tinto"], "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wgARCAMgAlgDASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAABAACAwUGAQf/xAAaAQADAQEBAQAAAAAAAAAAAAAAAQIDBAUG/9oADAMBAAIQAxAAAAHACmBy0kqSIHcHreFt6TGqBH3esxOPo83SpLVJJAkkCSJAZb66a8nI3+MihCHqLGFMCuEkqSSQJJAkkCSQJJAkkCSQJJAkkCSQJJBLMI5B04UssqLswDNMEBOc9BLJYgPUfRPa1DcNOOylikZU8XEzqSHqGX2sl+JxeoeY1LUihykRxQxfUPLr6l6j416X5XJGkrEkgSSAr0vEbIRayQuOxdO14JdawMSeDTNJJpJIEkgSSBJIEkgSSBJIEkgSSBd5Ihpc0OYKxLQ7OP0LF9fMme4ApHJ5OImHIgCd3ONPbxJqGccKZjm3LUkzqSD0fRCUuHRosBa2emXlx7JKkPrGg65p9Gizw26wstJLRJJAkuhoZxR4rSUNtTpwyRuVOY6RDKY8DXJJJiSQJJAkkCSQJJAkpURIh6QiIYOJJUJzS0EkxFchnVLb9iq5r6zRSh6zGpljG1aZEwsYGS19qHXSpESkQNGLEClZPBaakmnriD1lNml5Czdb474qot6jbABveM7o85okEZS6pU0krSSQLvOhasIimrRz3OaJ5YUadtqjQRear7in1xSIOqalFihxJDSSBKWIEk4HTRMlTF1xMBQpLZA+SxanY5eNt7E8LTQ5i0FNX9 8Ajv8Ay3LgFq6lBL6ESW1jcv8Aw2y36X/h4+p9X/Linv8Aw4wGnTKZ3XgnfJCqqwDm9Y/+YwjSRLgN4YnY1cu6qKVIj+q5cuXLl/4L/Tf+d/UNSqYl7qIjWyEMFDkHfvzEVIRcjy9srCMa4o1jkY1QplSv/juIbhSXYwx1kf8A5JVefqTF8R7mwJE1Y1Ml38yrK/MUSmLpanSOmce4qxpumNbJ6iI0mf8A47l//lXcrMCVDhmNiJA0JcTga4gAVAaDLEDYnishVau2NEBp4Y6S7EvVaOT/AO//2Q==", "photo_name": "Paella mixta.jpeg"}, {"title": "Sangría de vino tinto", "ingredients": ["2200 ml de vino tinto", "3000 ml de canadadry", "1 manzana verde", "500 gr de fresas", "500 gr de uva chilena", "250 ml de ron", "50 gr de romero fresco"], "procedure": ["Lave y desinfecte las frutas.", "Corte la manzana y las fresas en cubos y la uva en cuartos.", "Ponga las frutas en una jarra y mezcle con el vino, la gaseosa y el ron.", "Sirva con una ramita de romero y hielo."]}], "recipe_count": 2}]</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const booksEl = document.getElementById('books');
  const q = document.getElementById('q');
  const bookFilter = document.getElementById('bookFilter');
  const info = document.getElementById('info');
  const empty = document.getElementById('empty');
  const toggleAll = document.getElementById('toggleAll');
  const STORAGE_KEY = 'recetario-comfama-state-v3';

  // Restore state
  let state = { q: '', book: '', collapsed: {}, openProc: {}, allProc: false };
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = Object.assign(state, JSON.parse(saved));
  } catch (e) {}

  // Populate book filter
  DATA.forEach((b, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = b.title + ' (' + b.recipe_count + ')';
    bookFilter.appendChild(opt);
  });

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function highlight(text, term) {
    if (!term) return escapeHtml(text);
    const safe = escapeHtml(text);
    const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return safe.replace(re, '<mark>$1</mark>');
  }
  function recipeKey(bi, ri) { return bi + ':' + ri; }

  function render() {
    const term = (state.q || '').trim().toLowerCase();
    const bookIdx = state.book === '' ? null : parseInt(state.book, 10);
    booksEl.innerHTML = '';
    let totalShown = 0;
    DATA.forEach((book, bi) => {
      if (bookIdx !== null && bi !== bookIdx) return;
      const matches = book.recipes
        .map((r, ri) => ({ r, ri }))
        .filter(({ r }) => {
          if (!term) return true;
          if (r.title.toLowerCase().includes(term)) return true;
          if (r.ingredients.some(ing => ing.toLowerCase().includes(term))) return true;
          if ((r.procedure || []).some(s => s.toLowerCase().includes(term))) return true;
          return false;
        });
      if (matches.length === 0) return;

      const div = document.createElement('section');
      div.className = 'book';
      const isCollapsed = !!state.collapsed[bi];
      if (isCollapsed) div.classList.add('collapsed');

      const header = document.createElement('div');
      header.className = 'book-header';
      header.innerHTML =
        '<span class="book-title">' + escapeHtml(book.title) +
        '<span class="tag">' + matches.length + ' / ' + book.recipe_count + '</span></span>' +
        '<span class="book-count">' + (isCollapsed ? '▸' : '▾') + '</span>';
      header.addEventListener('click', () => {
        state.collapsed[bi] = !state.collapsed[bi];
        save(); render();
      });
      div.appendChild(header);

      const body = document.createElement('div');
      body.className = 'book-body';
      matches.forEach(({ r, ri }) => {
        const rdiv = document.createElement('div');
        rdiv.className = 'recipe';
        const titleHtml = highlight(r.title, term);
        const items = r.ingredients.map(ing => {
          const isSection = /^—\s.*\s—$/.test(ing);
          const cls = isSection ? ' class="section"' : '';
          return '<li' + cls + '>' + highlight(ing, term) + '</li>';
        }).join('');
        const proc = r.procedure || [];
        const key = recipeKey(bi, ri);
        const procOpen = state.allProc || !!state.openProc[key];
        const procItems = proc.map(s => '<li>' + highlight(s, term) + '</li>').join('');
        const procBlock = proc.length
          ? '<button class="proc-toggle" data-key="' + key + '">' +
            (procOpen ? 'Ocultar procedimiento' : 'Ver procedimiento (' + proc.length + ' pasos)') +
            '</button>' +
            '<ol class="proc' + (procOpen ? '' : ' hidden') + '" data-procof="' + key + '">' +
            procItems + '</ol>'
          : '<button class="proc-toggle" disabled title="Procedimiento no disponible">Sin procedimiento</button>';
        const photoHtml = r.photo
          ? '<img class="recipe-photo" loading="lazy" alt="' + escapeHtml(r.title) + '" src="' + r.photo + '" data-photo-title="' + escapeHtml(r.title) + '">'
          : '';
        if (r.photo) rdiv.classList.add('has-photo');
        const bodyCls = r.photo ? 'recipe-body' : 'recipe-body no-photo';
        const ingsBlock = '<div><ul class="ings">' + items + '</ul>' + procBlock + '</div>';
        rdiv.innerHTML = '<h3 class="recipe-title">' + titleHtml + '</h3>' +
                        '<div class="' + bodyCls + '">' +
                          (r.photo ? photoHtml : '') +
                          ingsBlock +
                        '</div>';
        body.appendChild(rdiv);
      });
      div.appendChild(body);
      booksEl.appendChild(div);
      totalShown += matches.length;
    });
    if (totalShown === 0) {
      empty.classList.remove('hidden');
      info.textContent = '';
    } else {
      empty.classList.add('hidden');
      info.textContent = totalShown + ' receta' + (totalShown === 1 ? '' : 's');
    }
    toggleAll.textContent = state.allProc ? 'Ocultar procedimientos' : 'Mostrar procedimientos';
    toggleAll.classList.toggle('on', state.allProc);
  }

  // Lightbox handler
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = lightbox.querySelector('img');
  booksEl.addEventListener('click', (e) => {
    const img = e.target.closest('.recipe-photo');
    if (img) {
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add('open');
    }
  });
  lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') lightbox.classList.remove('open');
  });

  // Event delegation for proc toggles
  booksEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.proc-toggle');
    if (!btn || btn.disabled) return;
    const key = btn.dataset.key;
    if (state.allProc) {
      // If global is on, individual toggle turns this one off temporarily
      // Simpler model: clicking a button when global is on flips global off and toggles this
      state.allProc = false;
      // mark all as currently shown
      // Actually simpler: just respect the new state
    }
    state.openProc[key] = !state.openProc[key];
    save(); render();
  });

  toggleAll.addEventListener('click', () => {
    state.allProc = !state.allProc;
    if (!state.allProc) state.openProc = {};
    save(); render();
  });

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  q.value = state.q || '';
  bookFilter.value = state.book || '';

  q.addEventListener('input', () => { state.q = q.value; save(); render(); });
  bookFilter.addEventListener('change', () => { state.book = bookFilter.value; save(); render(); });

  render();
})();
</script>
