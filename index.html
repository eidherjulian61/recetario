<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Recetario Comfama</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color: #1a1a1a;
  background: #fafaf7;
  line-height: 1.5;
  font-size: 15px;
}
.wrap { max-width: 920px; margin: 0 auto; padding: 24px 20px 64px; }
header {
  border-bottom: 1px solid #e5e2d8;
  padding-bottom: 16px;
  margin-bottom: 20px;
}
h1 {
  margin: 0 0 4px 0;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.subtitle {
  font-size: 13px;
  color: #6b6557;
}
.controls {
  position: sticky;
  top: 0;
  background: #fafaf7;
  padding: 12px 0 12px;
  z-index: 5;
  border-bottom: 1px solid #ece9df;
  margin-bottom: 16px;
}
.search-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
input[type="search"] {
  flex: 1;
  min-width: 220px;
  padding: 10px 14px;
  font-size: 15px;
  border: 1px solid #d4cfbf;
  border-radius: 8px;
  background: #fff;
  font-family: inherit;
}
input[type="search"]:focus {
  outline: none;
  border-color: #8b6f3f;
  box-shadow: 0 0 0 3px rgba(139, 111, 63, 0.12);
}
.filter-info { font-size: 13px; color: #6b6557; min-width: 80px; }
.book-filter {
  padding: 8px 12px;
  font-size: 13px;
  border: 1px solid #d4cfbf;
  border-radius: 8px;
  background: #fff;
  font-family: inherit;
}
.toggle-all {
  font-size: 13px;
  padding: 8px 12px;
  border: 1px solid #d4cfbf;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  color: #4a4538;
  font-family: inherit;
}
.toggle-all:hover { background: #f4f1e8; }
.toggle-all.on {
  background: #6b5a30;
  color: #fff;
  border-color: #6b5a30;
}
.book {
  margin-bottom: 24px;
  border: 1px solid #e5e2d8;
  border-radius: 10px;
  background: #fff;
  overflow: hidden;
}
.book-header {
  padding: 14px 18px;
  background: #f4f1e8;
  border-bottom: 1px solid #e5e2d8;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.book-title { font-weight: 600; font-size: 15px; color: #2d2820; }
.book-count { font-size: 12px; color: #8b8270; }
.book-body { padding: 4px 0; }
.book.collapsed .book-body { display: none; }
.recipe {
  padding: 14px 18px;
  border-bottom: 1px solid #f0ede2;
}
.recipe:last-child { border-bottom: none; }
.recipe-title {
  font-weight: 600;
  font-size: 14px;
  color: #1f1c16;
  margin: 0 0 8px 0;
}
.recipe-body {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 14px;
  align-items: start;
}
.recipe-body.no-photo { grid-template-columns: 1fr; }
.recipe-photo {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid #ece9df;
  background: #f4f1e8;
  cursor: zoom-in;
  display: block;
}
.has-photo .recipe-title::before {
  content: "F4F7";
  margin-right: 6px;
  font-size: 12px;
  opacity: 0.7;
}
@media (max-width: 540px) {
  .recipe-body { grid-template-columns: 1fr; }
  .recipe-photo { height: 200px; }
}
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(20,18,12,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  cursor: zoom-out;
  padding: 24px;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  border-radius: 6px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.ings {
  margin: 0;
  padding-left: 0;
  list-style: none;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 4px 18px;
}
.ings li {
  font-size: 13px;
  color: #4a4538;
  padding-left: 14px;
  position: relative;
}
.ings li::before {
  content: "·";
  position: absolute;
  left: 4px;
  color: #b7ad94;
  font-weight: 700;
}
.ings li.section {
  font-weight: 600;
  color: #6b5a30;
  margin-top: 6px;
}
.ings li.section::before { content: ""; }
mark {
  background: #fff3a8;
  padding: 0 2px;
  border-radius: 2px;
}
.proc-toggle {
  display: inline-block;
  margin-top: 10px;
  font-size: 12px;
  color: #6b5a30;
  background: transparent;
  border: 1px solid #d4cfbf;
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
}
.proc-toggle:hover { background: #f4f1e8; }
.proc-toggle:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.proc {
  margin: 12px 0 0 0;
  padding: 10px 16px 10px 14px;
  background: #fbf9f1;
  border-left: 2px solid #b7ad94;
  border-radius: 0 6px 6px 0;
  counter-reset: step;
  list-style: none;
}
.proc li {
  counter-increment: step;
  font-size: 13px;
  color: #2d2820;
  padding: 4px 0 4px 28px;
  position: relative;
}
.proc li::before {
  content: counter(step) ".";
  position: absolute;
  left: 0;
  width: 22px;
  font-weight: 600;
  color: #6b5a30;
  text-align: right;
}
.proc.hidden { display: none; }
.empty {
  padding: 24px 18px;
  text-align: center;
  color: #8b8270;
  font-size: 13px;
}
.hidden { display: none !important; }
.tag {
  display: inline-block;
  font-size: 11px;
  background: #ece9df;
  color: #6b6557;
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
  font-weight: 500;
}
footer {
  margin-top: 32px;
  padding-top: 16px;
  border-top: 1px solid #ece9df;
  font-size: 12px;
  color: #8b8270;
  text-align: center;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Recetario Comfama</h1>
    <div class="subtitle">8 libros · 172 recetas · 167 con procedimiento · 21 con foto</div>
  </header>

  <div class="controls">
    <div class="search-row">
      <input id="q" type="search" placeholder="Buscar por receta, ingrediente o paso (ej. 'pollo', 'mango', 'hornear')" autocomplete="off" />
      <select id="bookFilter" class="book-filter">
        <option value="">Todos los libros</option>
      </select>
      <button id="toggleAll" class="toggle-all" type="button">Mostrar procedimientos</button>
      <span class="filter-info" id="info"></span>
    </div>
  </div>

  <main id="books"></main>

  <div class="lightbox" id="lightbox"><img src="" alt=""></div>
  <div class="empty hidden" id="empty">No se encontraron recetas para tu búsqueda.</div>

  <footer>Generado el 2026-06-04 15:25 desde la carpeta Comfama. Datos integrados — la página no se conecta a Drive.</footer>
</div>


<script>
(async () => {
  const DATA = await fetch('recetas.json').then(r => {
    if (!r.ok) throw new Error('No se pudo cargar recetas.json (' + r.status + ')');
    return r.json();
  });
  const booksEl = document.getElementById('books');
  const q = document.getElementById('q');
  const bookFilter = document.getElementById('bookFilter');
  const info = document.getElementById('info');
  const empty = document.getElementById('empty');
  const toggleAll = document.getElementById('toggleAll');
  const STORAGE_KEY = 'recetario-comfama-state-v3';

  // Restore state
  let state = { q: '', book: '', collapsed: {}, openProc: {}, allProc: false };
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = Object.assign(state, JSON.parse(saved));
  } catch (e) {}

  // Populate book filter
  DATA.forEach((b, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = b.title + ' (' + b.recipe_count + ')';
    bookFilter.appendChild(opt);
  });

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function highlight(text, term) {
    if (!term) return escapeHtml(text);
    const safe = escapeHtml(text);
    const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return safe.replace(re, '<mark>$1</mark>');
  }
  function recipeKey(bi, ri) { return bi + ':' + ri; }

  function render() {
    const term = (state.q || '').trim().toLowerCase();
    const bookIdx = state.book === '' ? null : parseInt(state.book, 10);
    booksEl.innerHTML = '';
    let totalShown = 0;
    DATA.forEach((book, bi) => {
      if (bookIdx !== null && bi !== bookIdx) return;
      const matches = book.recipes
        .map((r, ri) => ({ r, ri }))
        .filter(({ r }) => {
          if (!term) return true;
          if (r.title.toLowerCase().includes(term)) return true;
          if (r.ingredients.some(ing => ing.toLowerCase().includes(term))) return true;
          if ((r.procedure || []).some(s => s.toLowerCase().includes(term))) return true;
          return false;
        });
      if (matches.length === 0) return;

      const div = document.createElement('section');
      div.className = 'book';
      const isCollapsed = !!state.collapsed[bi];
      if (isCollapsed) div.classList.add('collapsed');

      const header = document.createElement('div');
      header.className = 'book-header';
      header.innerHTML =
        '<span class="book-title">' + escapeHtml(book.title) +
        '<span class="tag">' + matches.length + ' / ' + book.recipe_count + '</span></span>' +
        '<span class="book-count">' + (isCollapsed ? '▸' : '▾') + '</span>';
      header.addEventListener('click', () => {
        state.collapsed[bi] = !state.collapsed[bi];
        save(); render();
      });
      div.appendChild(header);

      const body = document.createElement('div');
      body.className = 'book-body';
      matches.forEach(({ r, ri }) => {
        const rdiv = document.createElement('div');
        rdiv.className = 'recipe';
        const titleHtml = highlight(r.title, term);
        const items = r.ingredients.map(ing => {
          const isSection = /^—\s.*\s—$/.test(ing);
          const cls = isSection ? ' class="section"' : '';
          return '<li' + cls + '>' + highlight(ing, term) + '</li>';
        }).join('');
        const proc = r.procedure || [];
        const key = recipeKey(bi, ri);
        const procOpen = state.allProc || !!state.openProc[key];
        const procItems = proc.map(s => '<li>' + highlight(s, term) + '</li>').join('');
        const procBlock = proc.length
          ? '<button class="proc-toggle" data-key="' + key + '">' +
            (procOpen ? 'Ocultar procedimiento' : 'Ver procedimiento (' + proc.length + ' pasos)') +
            '</button>' +
            '<ol class="proc' + (procOpen ? '' : ' hidden') + '" data-procof="' + key + '">' +
            procItems + '</ol>'
          : '<button class="proc-toggle" disabled title="Procedimiento no disponible">Sin procedimiento</button>';
        const photoHtml = r.photo
          ? '<img class="recipe-photo" loading="lazy" alt="' + escapeHtml(r.title) + '" src="' + r.photo + '" data-photo-title="' + escapeHtml(r.title) + '">'
          : '';
        if (r.photo) rdiv.classList.add('has-photo');
        const bodyCls = r.photo ? 'recipe-body' : 'recipe-body no-photo';
        const ingsBlock = '<div><ul class="ings">' + items + '</ul>' + procBlock + '</div>';
        rdiv.innerHTML = '<h3 class="recipe-title">' + titleHtml + '</h3>' +
                        '<div class="' + bodyCls + '">' +
                          (r.photo ? photoHtml : '') +
                          ingsBlock +
                        '</div>';
        body.appendChild(rdiv);
      });
      div.appendChild(body);
      booksEl.appendChild(div);
      totalShown += matches.length;
    });
    if (totalShown === 0) {
      empty.classList.remove('hidden');
      info.textContent = '';
    } else {
      empty.classList.add('hidden');
      info.textContent = totalShown + ' receta' + (totalShown === 1 ? '' : 's');
    }
    toggleAll.textContent = state.allProc ? 'Ocultar procedimientos' : 'Mostrar procedimientos';
    toggleAll.classList.toggle('on', state.allProc);
  }

  // Lightbox handler
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = lightbox.querySelector('img');
  booksEl.addEventListener('click', (e) => {
    const img = e.target.closest('.recipe-photo');
    if (img) {
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add('open');
    }
  });
  lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') lightbox.classList.remove('open');
  });

  // Event delegation for proc toggles
  booksEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.proc-toggle');
    if (!btn || btn.disabled) return;
    const key = btn.dataset.key;
    if (state.allProc) {
      // If global is on, individual toggle turns this one off temporarily
      // Simpler model: clicking a button when global is on flips global off and toggles this
      state.allProc = false;
      // mark all as currently shown
      // Actually simpler: just respect the new state
    }
    state.openProc[key] = !state.openProc[key];
    save(); render();
  });

  toggleAll.addEventListener('click', () => {
    state.allProc = !state.allProc;
    if (!state.allProc) state.openProc = {};
    save(); render();
  });

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  q.value = state.q || '';
  bookFilter.value = state.book || '';

  q.addEventListener('input', () => { state.q = q.value; save(); render(); });
  bookFilter.addEventListener('change', () => { state.book = bookFilter.value; save(); render(); });

  render();
})();
</script>
</body>
</html>
